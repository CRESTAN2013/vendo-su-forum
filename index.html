<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendo su Forum - Gestione Inventario & Cloud</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #00adb5;
      --accent-hover: #00888e;
      --text-color: #eeeeee;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --success: #4eef90;
      --danger: #ff5252;
      --warning: #ffb74d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* Top Bar Header */
    header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 15px 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    h1 { font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 10px; }
    .sync-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .status-badge { font-size: 0.85rem; padding: 5px 10px; border-radius: 20px; background: #2a2a2a; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }

    /* Navigation Tabs */
    nav { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; padding-bottom: 5px; }
    .nav-tab { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; white-space: nowrap; }
    .nav-tab:hover { color: #fff; border-color: var(--accent-color); }
    .nav-tab.active { background: var(--accent-color); color: #fff; border-color: var(--accent-color); }

    /* Main Sections */
    .section { display: none; background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); margin-bottom: 20px; }
    .section.active { display: block; }

    /* UI Elements & Buttons */
    .btn { background: var(--accent-color); color: #fff; border: none; padding: 9px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; display: inline-flex; align-items: center; gap: 6px; font-size: 0.9rem; }
    .btn:hover { background: var(--accent-hover); }
    .btn-secondary { background: #333; color: #fff; border: 1px solid var(--border-color); }
    .btn-secondary:hover { background: #444; }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #d32f2f; }
    .btn-success { background: #2e7d32; }
    .btn-success:hover { background: #1b5e20; }

    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full-width { grid-column: 1 / -1; }
    label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; }
    input, select, textarea { background: #121212; border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 6px; font-size: 0.95rem; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent-color); outline: none; }

    /* Tables & Grids */
    .table-container { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 0.9rem; }
    th { background: #181818; color: var(--text-muted); }
    tr:hover { background: #252525; }

    /* Modals */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card-bg); border: 1px solid var(--border-color); width: 100%; max-width: 550px; border-radius: 8px; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
    .modal-close { cursor: pointer; font-size: 1.5rem; color: var(--text-muted); }
    .modal-close:hover { color: #fff; }

    /* Helper Utilities */
    .flex-row { display: flex; gap: 10px; align-items: center; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-success { background: rgba(78, 239, 144, 0.2); color: var(--success); }
    .badge-warning { background: rgba(255, 183, 77, 0.2); color: var(--warning); }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <h1>📦 Vendo su Forum</h1>
      <div class="sync-bar">
        <div id="syncStatus" class="status-badge">
          <span id="syncDot">🔴</span> <span id="syncText">GitHub Sync non configurato</span>
        </div>
        <button class="btn btn-secondary" onclick="openConfigModal()">⚙️ Impostazioni GitHub</button>
        <button class="btn btn-success" onclick="syncPush()">☁️ Salva su GitHub</button>
        <button class="btn btn-secondary" onclick="syncPull()">🔄 Carica da GitHub</button>
      </div>
    </header>

    <!-- Navigation -->
    <nav>
      <button class="nav-tab active" onclick="switchTab('inventoryTab', this)">📋 Inventario Prodotti</button>
      <button class="nav-tab" onclick="switchTab('forumsTab', this)">🌐 Directory Forum</button>
      <button class="nav-tab" onclick="switchTab('generatorTab', this)">📝 Generatore Annunci</button>
      <button class="nav-tab" onclick="switchTab('vaultTab', this)">🔒 Vault Credentials</button>
    </nav>

    <!-- TAB 1: Inventario -->
    <section id="inventoryTab" class="section active">
      <h2>Gestione Inventario</h2>
      <br>
      <form id="itemForm" onsubmit="saveItem(event)">
        <input type="hidden" id="itemId">
        <div class="form-group">
          <label>Nome Oggetto / Ricambio</label>
          <input type="text" id="itemTitle" required placeholder="Es. Cilindro Minarelli Orizzontale">
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="itemCategory">
            <option value="Motore">Motore</option>
            <option value="Ciclistica">Ciclistica</option>
            <option value="Elettronica">Elettronica</option>
            <option value="Accessori">Accessori</option>
            <option value="Altro">Altro</option>
          </select>
        </div>
        <div class="form-group">
          <label>Prezzo (€)</label>
          <input type="number" id="itemPrice" step="0.01" required placeholder="50.00">
        </div>
        <div class="form-group">
          <label>Stato</label>
          <select id="itemStatus">
            <option value="Disponibile">Disponibile</option>
            <option value="In Trattativa">In Trattativa</option>
            <option value="Venduto">Venduto</option>
          </select>
        </div>
        <div class="form-group full-width">
          <label>Descrizione Dettagliata</label>
          <textarea id="itemDescription" rows="3" placeholder="Condizioni, compatibilità, difetti..."></textarea>
        </div>
        <div class="form-group full-width">
          <button type="submit" class="btn">💾 Salva Oggetto</button>
          <button type="button" class="btn btn-secondary" onclick="resetItemForm()">Annulla</button>
        </div>
      </form>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Titolo</th>
              <th>Categoria</th>
              <th>Prezzo</th>
              <th>Stato</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="inventoryTable">
            <!-- Righe inserite dinamicamente -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- TAB 2: Directory Forum -->
    <section id="forumsTab" class="section">
      <h2>Directory Forum & Mercatini</h2>
      <br>
      <form id="forumForm" onsubmit="saveForum(event)">
        <input type="hidden" id="forumId">
        <div class="form-group">
          <label>Nome Forum</label>
          <input type="text" id="forumName" required placeholder="Es. Scooternos Forum">
        </div>
        <div class="form-group">
          <label>URL / Indirizzo Web</label>
          <input type="url" id="forumUrl" placeholder="https://...">
        </div>
        <div class="form-group">
          <label>Username / Nickname</label>
          <input type="text" id="forumUser" placeholder="Il tuo nick">
        </div>
        <div class="form-group full-width">
          <button type="submit" class="btn">💾 Salva Forum</button>
        </div>
      </form>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Forum</th>
              <th>Link</th>
              <th>Username</th>
              <th>Azioni</th>
            </tr>
          </thead>
          <tbody id="forumsTable">
            <!-- Righe forum -->
          </tbody>
        </table>
      </div>
    </section>

    <!-- TAB 3: Generatore Annunci -->
    <section
